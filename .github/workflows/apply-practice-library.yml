name: Apply Practice Library integration

on:
  push:
    branches:
      - codex/practice-library
    paths:
      - .github/workflows/apply-practice-library.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/practice-library
      - name: Apply prepared source patch
        shell: bash
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 --decode | xz --decompress > /tmp/practice-library.patch
          git apply /tmp/practice-library.patch
          rm .github/workflows/apply-practice-library.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add authentic speech Practice Library"
          git push origin HEAD:codex/practice-library
