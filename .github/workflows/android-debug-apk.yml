name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: interpreter-trainer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  neural-model-smoke-test:
    name: Load and run Interpreter AI model
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the same LiteRT-LM release used by Android
        run: python -m pip install --upgrade "litert-lm==0.14.0"

      - name: Download the exact Qwen model with retry/backoff
        shell: bash
        env:
          MODEL_URL: https://huggingface.co/litert-community/Qwen3-0.6B/resolve/main/qwen3_0_6b_mixed_int4.litertlm?download=true
          MODEL_PATH: /tmp/qwen3_0_6b_mixed_int4.litertlm
        run: |
          set -euo pipefail
          curl --location --fail --show-error \
            --retry 12 --retry-all-errors --retry-delay 15 \
            --connect-timeout 30 --max-time 1200 \
            --user-agent "InterpreterTrainer-CI/1.0" \
            --output "$MODEL_PATH" "$MODEL_URL"
          test "$(stat -c%s "$MODEL_PATH")" -gt 450000000

      - name: Initialize model and generate a real response
        shell: bash
        run: |
          set -euo pipefail
          timeout 15m litert-lm run \
            /tmp/qwen3_0_6b_mixed_int4.litertlm \
            --backend=cpu \
            --prompt="You are an interpreter coach. Reply in one short sentence confirming that neural inference works." \
            | tee /tmp/interpreter-ai-smoke.log
          test -s /tmp/interpreter-ai-smoke.log
