name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install stable development signing key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/interpreter-debug.keystore"
          base64 --decode .github/interpreter-debug.keystore.b64 > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" \
            -storepass android -alias androiddebugkey >/dev/null
          echo "Stable Interpreter Trainer development signing key installed."

      - name: Guard neural one-shot conversation architecture
        shell: bash
        run: |
          set -euo pipefail
          AI_FILE="app/src/main/java/com/interpretertrainer/app/ai/OnDeviceInterpreterAi.kt"
          if grep -q "Runtime health check" "$AI_FILE"; then
            echo "A hidden sendMessage health probe would consume a real conversation turn."
            exit 1
          fi
          if grep -Eq "private var conversation|var conversation: Conversation" "$AI_FILE"; then
            echo "Do not keep a native LiteRT Conversation across user messages for this Qwen3 model."
            exit 1
          fi
          grep -q "private suspend fun sendOneShot" "$AI_FILE"
          grep -q "currentEngine.createConversation" "$AI_FILE"
          grep -q "sendMessageAsync" "$AI_FILE"

      - name: Build debug APK
        env:
          INTERPRETER_VERSION_CODE: ${{ github.run_number }}
          INTERPRETER_DEBUG_KEYSTORE: ${{ runner.temp }}/interpreter-debug.keystore
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          KEYSTORE="$RUNNER_TEMP/interpreter-debug.keystore"

          keytool -exportcert \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias androiddebugkey \
            -file /tmp/interpreter-debug-cert.der >/dev/null 2>&1
          EXPECTED_SHA256="$(sha256sum /tmp/interpreter-debug-cert.der | awk '{print tolower($1)}')"

          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk \
            | tee /tmp/apk-signing.txt
          ACTUAL_SHA256="$(awk -F': ' '/certificate SHA-256 digest:/ {print tolower($2); exit}' /tmp/apk-signing.txt | tr -d '[:space:]')"

          if [ -z "$ACTUAL_SHA256" ] || [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "APK signing certificate mismatch."
            echo "Expected: $EXPECTED_SHA256"
            echo "Actual:   ${ACTUAL_SHA256:-missing}"
            exit 1
          fi
          echo "APK signing certificate matches the stable Interpreter Trainer development key."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: interpreter-trainer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  neural-model-smoke-test:
    name: Load and run Interpreter AI model
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the same LiteRT-LM release used by Android
        run: python -m pip install --upgrade "litert-lm==0.14.0"

      - name: Download the exact Qwen model with retry/backoff
        shell: bash
        env:
          MODEL_URL: https://huggingface.co/litert-community/Qwen3-0.6B/resolve/main/qwen3_0_6b_mixed_int4.litertlm?download=true
          MODEL_PATH: /tmp/qwen3_0_6b_mixed_int4.litertlm
        run: |
          set -euo pipefail
          curl --location --fail --show-error \
            --retry 12 --retry-all-errors --retry-delay 15 \
            --connect-timeout 30 --max-time 1200 \
            --user-agent "InterpreterTrainer-CI/1.0" \
            --output "$MODEL_PATH" "$MODEL_URL"
          test "$(stat -c%s "$MODEL_PATH")" -gt 450000000

      - name: Generate two turns with one fresh conversation per message
        shell: bash
        run: |
          set -euo pipefail
          timeout 15m python - <<'PY'
          import litert_lm

          model_path = "/tmp/qwen3_0_6b_mixed_int4.litertlm"

          def text_from_chunk(chunk):
              parts = []
              for item in chunk.get("content", []) or []:
                  if isinstance(item, dict) and item.get("type") == "text":
                      parts.append(item.get("text", ""))
              for value in (chunk.get("channels", {}) or {}).values():
                  if isinstance(value, str):
                      parts.append(value)
              return "".join(parts)

          prompts = [
              "Reply in one short sentence confirming message one works.",
              "Recent chat context: User asked whether message one worked. Coach confirmed it. Now reply in one short sentence confirming message two works.",
          ]
          outputs = []

          with litert_lm.Engine(
              model_path,
              backend=litert_lm.Backend.CPU(),
              max_num_tokens=1280,
          ) as engine:
              for prompt in prompts:
                  # Deliberately create a new native Conversation for every user message while
                  # reusing the already-loaded Engine. This mirrors the Android workaround for
                  # Qwen3/LiteRT-LM 0.14.0's turn-two incremental prompt-prefix failure.
                  with engine.create_conversation(
                      system_message="You are a concise interpreter coach.",
                      extra_context={"enable_thinking": False},
                      max_output_tokens=80,
                  ) as conversation:
                      text = ""
                      for chunk in conversation.send_message_async(
                          prompt,
                          max_output_tokens=80,
                      ):
                          text += text_from_chunk(chunk)
                      if not text.strip():
                          raise RuntimeError(f"Empty neural response for prompt: {prompt}")
                      outputs.append(text.strip())

          print("FIRST RESPONSE LENGTH:", len(outputs[0]))
          print("SECOND RESPONSE LENGTH:", len(outputs[1]))
          PY
