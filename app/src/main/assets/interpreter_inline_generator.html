<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://js.puter.com/v2/"></script>
</head>
<body>
<script>
  // Passage generation is a narrow, format-constrained task. Prefer Puter's low-latency
  // model here and leave the larger Qwen model to the full coaching experience.
  const INLINE_MODEL = 'gemini-3.1-flash-lite';
  const INLINE_FALLBACK_MODEL = 'qwen/qwen3.6-27b';
  const GENERATION_TIMEOUT_MS = 30000;
  let generationInFlight = false;

  function withGenerationDeadline(promise, controller) {
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => {
        controller.abort();
        const error = new Error('Generation timed out.');
        error.name = 'AbortError';
        reject(error);
      }, GENERATION_TIMEOUT_MS);
      Promise.resolve(promise).then(
        value => { clearTimeout(timer); resolve(value); },
        error => { clearTimeout(timer); reject(error); }
      );
    });
  }

  function nativeCall(name, value) {
    try { window.InlineAiNative?.[name]?.(String(value ?? '')); } catch (_) {}
  }

  async function ensureConnected() {
    if (!window.puter) throw new Error('The online AI service did not load. Check your connection and try again.');
    if (!puter.auth.isSignedIn()) {
      await puter.auth.signIn({ attempt_temp_user_creation: true });
    }
  }

  async function generateWithModel(prompt, maxTokens, model) {
    const controller = new AbortController();
    return withGenerationDeadline((async () => {
      const stream = await puter.ai.chat(
        [
          {
            role: 'system',
            content: 'Write only a polished source passage for interpreter practice. Obey the requested language, length, and format. No commentary.'
          },
          { role: 'user', content: String(prompt || '') }
        ],
        {
          model,
          stream: true,
          max_tokens: Math.max(180, Math.min(Number(maxTokens) || 420, 720)),
          temperature: 0.45,
          signal: controller.signal
        }
      );

      let answer = '';
      for await (const part of stream) {
        if (part?.type === 'error') {
          throw new Error(part?.error?.message || part?.message || 'The AI stream failed.');
        }
        answer += typeof part === 'string'
          ? part
          : (typeof part?.text === 'string'
              ? part.text
              : (typeof part?.delta?.content === 'string' ? part.delta.content : ''));
      }
      if (!answer.trim()) throw new Error('The AI returned an empty passage.');
      return answer;
    })(), controller);
  }

  window.generatePracticeText = async function(prompt, maxTokens) {
    if (generationInFlight) return;
    generationInFlight = true;
    try {
      await ensureConnected();
      let answer;
      try {
        answer = await generateWithModel(prompt, maxTokens, INLINE_MODEL);
      } catch (primaryError) {
        if (primaryError?.name === 'AbortError') throw primaryError;
        answer = await generateWithModel(prompt, maxTokens, INLINE_FALLBACK_MODEL);
      }
      nativeCall('onGenerated', answer);
    } catch (error) {
      const message = error?.name === 'AbortError'
        ? 'Generation took too long. Please try again.'
        : (error?.message || error || 'Could not generate a passage.');
      nativeCall('onError', message);
    } finally {
      generationInFlight = false;
    }
  };

  nativeCall('onReady', 'ready');
</script>
</body>
</html>
