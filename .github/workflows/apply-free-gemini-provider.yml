name: Apply free Gemini provider

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/qwen38-signbridge
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply guarded free-provider migration
        run: python3 tools/apply_free_gemini_provider.py

      - name: Verify JavaScript and payment-free routing
        shell: bash
        run: |
          set -euo pipefail
          grep -q "FREE_AI_MODEL='gemini-3.7-flash'" app/src/main/assets/interpreter_coach.html
          grep -q "generativelanguage.googleapis.com" app/src/main/assets/interpreter_coach.html
          grep -q "freeAiSetupOverlay" app/src/main/assets/interpreter_coach.html
          grep -q "getFreeAiApiKey" app/src/main/java/com/interpretertrainer/app/ui/screens/AiCoachScreen.kt
          ! grep -q "puter.ai.speech2txt" app/src/main/assets/interpreter_coach.html
          ! grep -q "const r=await puter.ai.chat" app/src/main/assets/interpreter_coach.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('app/src/main/assets/interpreter_coach.html').read_text(encoding='utf-8')
          for i,script in enumerate(re.findall(r'<script(?: [^>]*)?>(.*?)</script>',html,flags=re.S)):
              if script.strip(): Path(f'/tmp/coach-{i}.js').write_text(script,encoding='utf-8')
          PY
          for f in /tmp/coach-*.js; do node --check "$f"; done
          node --check app/src/main/assets/interpreter_ai_bootstrap.js
          node --check app/src/main/assets/interpreter_precise_barge_in.js

      - name: Run Android tests and build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Commit verified production change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            app/src/main/assets/interpreter_coach.html \
            app/src/main/assets/interpreter_ai_bootstrap.js \
            app/src/main/java/com/interpretertrainer/app/ui/screens/AiCoachScreen.kt
          if ! git diff --cached --quiet; then
            git commit -m "Make free Gemini the default Interpreter AI provider"
            git pull --rebase origin feature/qwen38-signbridge
            git push origin HEAD:feature/qwen38-signbridge
          fi
