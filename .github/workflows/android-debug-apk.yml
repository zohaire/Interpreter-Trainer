name: Android quality and release

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  puter-ai-browser-test:
    name: Verify secure streaming Interpreter AI
    uses: ./.github/workflows/interpreter-ai-e2e.yml

  build:
    env:
      INTERPRETER_BACKEND_URL: ${{ vars.INTERPRETER_BACKEND_URL }}
      FIREBASE_ANDROID_API_KEY: ${{ vars.FIREBASE_ANDROID_API_KEY }}
      FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FACEBOOK_APP_ID: ${{ vars.FACEBOOK_APP_ID }}
      FACEBOOK_CLIENT_TOKEN: ${{ vars.FACEBOOK_CLIENT_TOKEN }}
    needs: puter-ai-browser-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install stable development signing key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/interpreter-debug.keystore"
          base64 --decode .github/interpreter-debug.keystore.b64 > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" \
            -storepass android -alias androiddebugkey >/dev/null
          echo "Stable Interpreter Trainer development signing key installed."

      - name: Run unit tests and Android lint
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug

      - name: Build debug and optimized preview packages
        env:
          INTERPRETER_VERSION_CODE: 100${{ github.run_number }}
          INTERPRETER_VERSION_NAME: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('1.0.0-preview.{0}', github.run_number) || '1.0.0-preview.ci' }}
          INTERPRETER_DEBUG_KEYSTORE: ${{ runner.temp }}/interpreter-debug.keystore
          INTERPRETER_RELEASE_KEYSTORE: ${{ runner.temp }}/interpreter-debug.keystore
          INTERPRETER_RELEASE_STORE_PASSWORD: android
          INTERPRETER_RELEASE_KEY_ALIAS: androiddebugkey
          INTERPRETER_RELEASE_KEY_PASSWORD: android
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease :app:bundleRelease

      - name: Verify package signatures
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          KEYSTORE="$RUNNER_TEMP/interpreter-debug.keystore"

          keytool -exportcert \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias androiddebugkey \
            -file /tmp/interpreter-debug-cert.der >/dev/null 2>&1
          EXPECTED_SHA256="$(sha256sum /tmp/interpreter-debug-cert.der | awk '{print tolower($1)}')"

          for APK in \
            app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/release/app-release.apk; do
            "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/apk-signing.txt
            ACTUAL_SHA256="$(awk -F': ' '/certificate SHA-256 digest:/ {print tolower($NF); exit}' /tmp/apk-signing.txt | tr -d '[:space:]')"
            if [ -z "$ACTUAL_SHA256" ] || [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
              echo "APK signing certificate mismatch for $APK."
              exit 1
            fi
          done
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab >/dev/null
          echo "APK and app-bundle signatures are valid for the public preview key."

      - name: Upload tested preview packages and reports
        uses: actions/upload-artifact@v4
        with:
          name: interpreter-trainer-preview-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: error

  account-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch and account storage checks on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-device-test-reports
          path: app/build/reports/androidTests/

  publish-preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.INTERPRETER_LIVE_RELEASE_VERIFIED == 'true'
    needs: [build, account-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4

      - name: Download tested packages
        uses: actions/download-artifact@v4
        with:
          name: interpreter-trainer-preview-${{ github.sha }}
          path: dist

      - name: Publish tagged public preview
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v1.0.0-preview.${GITHUB_RUN_NUMBER}"
          APK="$(find dist -path '*/apk/release/app-release.apk' -type f -print -quit)"
          AAB="$(find dist -path '*/bundle/release/app-release.aab' -type f -print -quit)"
          test -n "$APK" && test -n "$AAB"
          cp "$APK" Interpreter-Trainer-${TAG}.apk
          cp "$AAB" Interpreter-Trainer-${TAG}.aab
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "Interpreter Trainer $TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --verify-tag \
            --prerelease \
            --title "Interpreter Trainer ${TAG}" \
            --notes-file docs/PREVIEW_RELEASE_NOTES.md \
            "Interpreter-Trainer-${TAG}.apk#Android APK (public preview signing key)" \
            "Interpreter-Trainer-${TAG}.aab#Android App Bundle (public preview signing key)"
