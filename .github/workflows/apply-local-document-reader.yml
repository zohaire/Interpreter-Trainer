name: Apply local document reader

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate-test-commit:
    if: github.head_ref == 'feature/qwen38-signbridge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/qwen38-signbridge
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply guarded local document migration
        run: python3 tools/apply_local_document_reader.py

      - name: Validate attachment JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('app/src/main/assets/interpreter_coach.html').read_text(encoding='utf-8')
          match = re.search(r'<script id="universal-attachment-support">(.*?)</script>', html, flags=re.S)
          assert match, 'Attachment script is missing'
          script = match.group(1)
          assert 'DOC_READER_MODEL' not in script, 'Paid secondary document-reader model still present'
          assert 'getPreparedAttachment' in script, 'Native local document bridge missing'
          Path('/tmp/attachments.js').write_text(script, encoding='utf-8')
          PY
          node --check /tmp/attachments.js

      - name: Test and build Android app
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Commit verified local document reader
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/build.gradle.kts app/src/main/java/com/interpretertrainer/app/ui/screens/AiCoachScreen.kt app/src/main/java/com/interpretertrainer/app/ui/screens/LocalDocumentExtractor.kt app/src/main/assets/interpreter_coach.html
          if ! git diff --cached --quiet; then
            git commit -m "Read documents locally before Qwen"
            git pull --rebase origin feature/qwen38-signbridge
            git push origin HEAD:feature/qwen38-signbridge
          fi
