name: Apply manual live interruption DOM guard

on:
  push:
    branches:
      - feature/qwen38-signbridge

permissions:
  contents: write

jobs:
  fix-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/qwen38-signbridge
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply DOM guard
        run: python3 tools/fix_manual_orb_dom_guard.py
      - name: Validate precise voice script
        run: |
          node --check app/src/main/assets/interpreter_precise_barge_in.js
          node .github/tests/interpreter-live-conversation.cjs
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/src/main/assets/interpreter_precise_barge_in.js
          if ! git diff --cached --quiet; then
            git commit -m "Make manual live interruption DOM-safe"
            git push origin HEAD:feature/qwen38-signbridge
          fi
