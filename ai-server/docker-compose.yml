services:
  interpreter-ai:
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - llama-cache:/root/.cache
    command:
      - "-hf"
      - "Qwen/Qwen2.5-1.5B-Instruct-GGUF:Q4_K_M"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-c"
      - "4096"
      - "-n"
      - "768"

volumes:
  llama-cache:
