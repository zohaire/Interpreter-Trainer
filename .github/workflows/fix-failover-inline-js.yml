name: Fix failover inline JavaScript

on:
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: write

jobs:
  repair-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/qwen38-signbridge
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Repair inline JavaScript escaping
        run: python3 tools/fix_failover_inline_js.py

      - name: Validate inline JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('app/src/main/assets/interpreter_coach.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>([\s\S]*?)</script>', html)
          if not scripts:
              raise SystemExit('No inline script blocks found')
          for i, script in enumerate(scripts):
              Path(f'/tmp/interpreter-inline-{i}.js').write_text(script, encoding='utf-8')
          PY
          for file in /tmp/interpreter-inline-*.js; do node --check "$file"; done
          grep -q "gemini-3.7-flash','gemini-3.6-flash','gemini-3.5-flash','gemini-3.5-flash-lite" app/src/main/assets/interpreter_coach.html
          ! grep -R -qE 'puter\.ai\.(chat|speech2txt|txt2speech)' app/src/main

      - name: Run Android tests and build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Commit verified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/interpreter_coach.html
          if ! git diff --cached --quiet; then
            git commit -m "Fix failover inline JavaScript escaping"
            git pull --rebase origin feature/qwen38-signbridge
            git push origin HEAD:feature/qwen38-signbridge
          fi
