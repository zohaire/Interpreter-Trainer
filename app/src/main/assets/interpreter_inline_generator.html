<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://js.puter.com/v2/"></script>
</head>
<body>
<script>
  // Use a non-reasoning model so the passage budget is spent on visible text.
  const INLINE_MODEL = 'gpt-4.1-mini';
  let generationInFlight = false;

  function nativeCall(name, value) {
    try { window.InlineAiNative?.[name]?.(String(value ?? '')); } catch (_) {}
  }

  async function ensureConnected() {
    if (!window.puter) throw new Error('The online AI service did not load. Check your connection and try again.');
    if (!puter.auth.isSignedIn()) {
      await puter.auth.signIn({ attempt_temp_user_creation: true });
    }
  }

  window.generatePracticeText = async function(prompt, maxTokens) {
    if (generationInFlight) return;
    generationInFlight = true;
    try {
      await ensureConnected();
      const stream = await puter.ai.chat(
        [
          {
            role: 'system',
            content: 'You generate clean source passages for professional interpreter practice. Follow the output format exactly and never add commentary.'
          },
          { role: 'user', content: String(prompt || '') }
        ],
        {
          model: INLINE_MODEL,
          stream: true,
          max_tokens: Math.max(200, Math.min(Number(maxTokens) || 600, 1000))
        }
      );

      // Puter may return either an async stream or a completed response.
      // Read content only: reasoning and usage events are not practice material.
      const textOf = part => {
        if (typeof part === 'string') return part;
        if (!part || /reasoning|thinking|usage/.test(part.type || '')) return '';
        if (part.type === 'error' || part.error) {
          throw new Error(part.error?.message || part.message || 'The AI request failed.');
        }
        if (typeof part.text === 'string') return part.text;
        if (part.type === 'response.output_text.delta' && typeof part.delta === 'string') return part.delta;
        const content = part.delta?.content ?? part.choices?.[0]?.delta?.content ??
          part.message?.content ?? part.choices?.[0]?.message?.content;
        if (typeof content === 'string') return content;
        if (Array.isArray(content)) return content
          .filter(item => item?.type === 'text' || item?.type === 'output_text')
          .map(item => item.text || '').join('');
        return '';
      };
      let answer = '';
      if (stream && typeof stream[Symbol.asyncIterator] === 'function') {
        for await (const part of stream) answer += textOf(part);
      } else {
        answer = textOf(stream);
      }

      if (!answer.trim()) throw new Error('The AI returned an empty passage.');
      nativeCall('onGenerated', answer);
    } catch (error) {
      nativeCall('onError', error?.message || error || 'Could not generate a passage.');
    } finally {
      generationInFlight = false;
    }
  };

  nativeCall('onReady', 'ready');
</script>
</body>
</html>
