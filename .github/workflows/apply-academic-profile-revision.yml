name: Apply academic profile revision

on:
  push:
    branches:
      - feature/qwen38-signbridge

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/qwen38-signbridge
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Apply guarded academic profile revision
        run: python3 tools/revise_creator_academic_profile.py
      - name: Verify profile content
        run: |
          set -euo pipefail
          FILE=app/src/main/java/com/interpretertrainer/app/ui/screens/AiCoachScreen.kt
          grep -q 'English Studies and linguistics' "$FILE"
          grep -q 'multilingual communication' "$FILE"
          ! grep -q 'The Use of Interactive Learning Applications to Foster Student Engagement' "$FILE"
          ! grep -q 'Ahmed Ech-charfi' "$FILE"
          ! grep -q 'spanning 2023-2026' "$FILE"
      - name: Run Android unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Commit verified profile change
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/src/main/java/com/interpretertrainer/app/ui/screens/AiCoachScreen.kt
          if ! git diff --cached --quiet; then
            git commit -m "Refocus creator profile on linguistics"
            git push origin HEAD:feature/qwen38-signbridge
          fi
