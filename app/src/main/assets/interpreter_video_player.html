<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<style>html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}#player{width:100%;height:100%}#error{position:absolute;bottom:0;background:#111;color:white;padding:8px;font:14px sans-serif;display:none}a{color:#abc9ff}</style></head>
<body><div id="player"></div><div id="error"></div>
<script>
const videoId = __VIDEO_ID_JSON__;
let player, resumeAfterRecognition = false;
window.prepareForRecognition = () => { resumeAfterRecognition = player?.getPlayerState?.() === 1; };
window.restoreAfterRecognition = () => {
  if (resumeAfterRecognition) { resumeAfterRecognition = false; player?.playVideo?.(); }
};
function onYouTubeIframeAPIReady() {
  player = new YT.Player('player', {
    width:'100%', height:'100%', videoId,
    playerVars:{playsinline:1,rel:0,origin:location.origin},
    events:{onError(event){
      const error = document.getElementById('error');
      error.style.display='block';
      error.textContent='This video cannot play here (' + event.data + '). ';
      const link=document.createElement('a');link.href='https://www.youtube.com/watch?v='+encodeURIComponent(videoId);
      link.textContent='Open on YouTube';error.appendChild(link);
    }}
  });
}
</script><script src="https://www.youtube.com/iframe_api"></script></body></html>
