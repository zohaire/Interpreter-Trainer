name: Apply Interpreter Live profile UI changes

on:
  push:
    branches:
      - feature/qwen38-signbridge

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/qwen38-signbridge
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Apply guarded changes
        run: python3 tools/apply_live_interrupt_profile_ui.py

      - name: Verify JavaScript syntax and migration markers
        shell: bash
        run: |
          set -euo pipefail
          node --check app/src/main/assets/interpreter_ai_bootstrap.js
          node --check app/src/main/assets/interpreter_precise_barge_in.js
          grep -q "AUTHORITATIVE CREATOR ACADEMIC PROFILE" app/src/main/java/com/interpretertrainer/app/ui/screens/AiCoachScreen.kt
          grep -q "Université Mohammed V de Rabat" app/src/main/java/com/interpretertrainer/app/ui/screens/AiCoachScreen.kt
          grep -q "__interpreterManualBargeIn" app/src/main/assets/interpreter_precise_barge_in.js
          grep -q "Tap to interrupt Interpreter Live" app/src/main/assets/interpreter_ai_bootstrap.js
          ! grep -q 'id="evalTab"' app/src/main/assets/interpreter_coach.html
          ! grep -q 'id="evaluatePane"' app/src/main/assets/interpreter_coach.html

      - name: Run Android tests and build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Commit verified app changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            app/src/main/assets/interpreter_ai_bootstrap.js \
            app/src/main/assets/interpreter_coach.html \
            app/src/main/assets/interpreter_precise_barge_in.js \
            app/src/main/java/com/interpretertrainer/app/ui/screens/AiCoachScreen.kt
          if ! git diff --cached --quiet; then
            git commit -m "Enable tap interruption and enrich creator academic profile"
            git push origin HEAD:feature/qwen38-signbridge
          fi
