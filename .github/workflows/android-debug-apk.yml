name: Android quality and release

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  puter-ai-browser-test:
    name: Verify professional AI and Interpreter Live
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify live Puter model catalog contains Qwen3.8 27B Free
        shell: bash
        run: |
          set -euo pipefail
          curl --location --fail --silent --show-error --max-time 45 \
            https://api.puter.com/puterai/chat/models/details \
            --output /tmp/puter-models.json
          test -s /tmp/puter-models.json
          grep -q 'qwen/qwen3.8-27b:free' /tmp/puter-models.json
          echo "Qwen3.8 27B Free is present in Puter's live catalog."

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Interpreter AI and Live browser scripts
        shell: bash
        run: |
          set -euo pipefail
          node --check app/src/main/assets/interpreter_professional_ai.js
          node --check app/src/main/assets/interpreter_ai_provider.js
          node --check app/src/main/assets/interpreter_ai_bootstrap.js
          node --check app/src/main/assets/interpreter_fast_voice.js
          node --check app/src/main/assets/interpreter_professional_voice.js
          node --check app/src/main/assets/interpreter_precise_barge_in.js
          node --check app/src/main/assets/interpreter_live_latency.js
          node --check app/src/main/assets/interpreter_standard_arabic.js
          grep -q '__interpreterAiBootstrapV5' app/src/main/assets/interpreter_ai_bootstrap.js
          grep -q '__fastInterpreterVoiceV4' app/src/main/assets/interpreter_fast_voice.js
          grep -q 'Professional AI · connected' app/src/main/assets/interpreter_ai_bootstrap.js
          grep -q 'connectFromUserGesture' app/src/main/assets/interpreter_ai_provider.js
          grep -q 'attempt_temp_user_creation' app/src/main/assets/interpreter_ai_provider.js
          grep -q '__professionalInterpreterVoiceV1' app/src/main/assets/interpreter_professional_voice.js
          grep -q 'voiceCallLaunch' app/src/main/assets/interpreter_ai_bootstrap.js
          grep -q 'voiceCallOverlay' app/src/main/assets/interpreter_ai_bootstrap.js
          grep -q 'voiceBtn' app/src/main/assets/interpreter_ai_bootstrap.js
          if grep -q 'await ensureConnected' app/src/main/assets/interpreter_fast_voice.js; then
            echo 'Interpreter AI must not await readiness before its first Puter request.'
            exit 1
          fi

      - name: Test provider authentication recovery and timeouts
        shell: bash
        run: |
          node .github/tests/interpreter-arabic-observer.cjs
          node .github/tests/interpreter-ai-provider.cjs

      - name: Install headless Chromium
        working-directory: /tmp
        run: |
          mkdir -p /tmp/puter-ci
          cd /tmp/puter-ci
          npm init -y >/dev/null
          npm install --silent playwright@1.55.0
          npx playwright install chromium

      - name: Test every Android AI runtime layer together
        env:
          NODE_PATH: /tmp/puter-ci/node_modules
        run: node .github/tests/interpreter-full-runtime.cjs

      - name: Verify precise voice interruption filter
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/puter-ci/barge-test.cjs <<'NODE'
          const { chromium } = require('playwright');
          const path = require('path');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            await page.setContent(`<!doctype html><html><body>
              <textarea id="chatInput"></textarea>
              <div id="voiceOrb"></div>
              <div id="voiceCallStatus"></div>
              <div id="voiceCallLive"></div>
              <div id="chatError"></div>
              <select id="callVoiceLang"><option value="en-US" selected>English</option></select>
              <script>
                var busy = false;
                window.__voiceCallActive = true;
                window.__voiceCallMuted = false;
                window.__fastInterpreterVoiceV4 = true;
                window.__fastInterpreterVoiceState = {
                  queue: [], speaking: true, streamComplete: false,
                  streamAnswer: 'The economy is growing strongly and employment continues to improve.',
                  speechReference: 'The economy is growing strongly and employment continues to improve.',
                  bargeArmed: true, userBarging: false, responseId: 1, language: 'en-US'
                };
                window.__stops = 0;
                window.__starts = 0;
                window.InterpreterNative = {
                  stopSpeaking(){ window.__stops += 1; },
                  startVoiceInput(){ window.__starts += 1; },
                  setVoiceLanguage(){}
                };
                window.stopNaturalInterpreterVoice = function(){};
                window.__voiceInputStopped = function(){};
                window.hideTyping = function(){};
                window.updateSendState = function(){};
                window.resizeComposer = function(){};
                window.sendChat = function(){};
              </script>
            </body></html>`);

            const patch = path.join(process.env.GITHUB_WORKSPACE, 'app/src/main/assets/interpreter_precise_barge_in.js');
            await page.addScriptTag({ path: patch });

            await page.evaluate(() => {
              window.__voiceInputPartial('the economy is growing');
              window.__voiceInputPartial('the economy is growing strongly');
              window.__voiceInputPartial('uh');
            });
            let stops = await page.evaluate(() => window.__stops);
            if (stops !== 0) throw new Error(`Echo/noise incorrectly interrupted AI (${stops} stops).`);

            await page.evaluate(() => window.__voiceInputPartial('actually I mean'));
            await page.waitForTimeout(145);
            stops = await page.evaluate(() => window.__stops);
            if (stops !== 0) throw new Error('A single partial result interrupted AI too early.');

            await page.evaluate(() => window.__voiceInputPartial('actually I mean the other point'));
            stops = await page.evaluate(() => window.__stops);
            if (stops !== 1) throw new Error(`Stable intentional speech did not interrupt exactly once (${stops} stops).`);

            await browser.close();
            console.log('Precise interruption filter passed echo, noise, and intentional-speech checks.');
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

          cd /tmp/puter-ci
          node barge-test.cjs

      - name: Verify professional AI first-turn activation and Interpreter Live UI
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --directory "$GITHUB_WORKSPACE/app/src/main/assets" >/tmp/interpreter-ai-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          cat > /tmp/puter-ci/activation-test.cjs <<'NODE'
          const { chromium } = require('playwright');
          const path = require('path');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();

            await page.route('https://js.puter.com/v2/**', async route => {
              await route.fulfill({
                status: 200,
                contentType: 'application/javascript',
                body: `
                  window.__chatCalls = [];
                  window.__signInCalls = 0;
                  window.__signInActivation = false;
                  window.__mockSigned = false;
                  window.puter = {
                    auth: {
                      isSignedIn(){ return window.__mockSigned; },
                      signIn(){
                        window.__signInCalls += 1;
                        window.__signInActivation = Boolean(navigator.userActivation?.isActive);
                        window.__mockSigned = true;
                        return Promise.resolve({ success:true });
                      }
                    },
                    ai: {
                      chat(messages, options){
                        window.__chatCalls.push({
                          options,
                          userActivation:Boolean(navigator.userActivation?.isActive)
                        });
                        window.__mockSigned = true;
                        if (options?.stream) return (async function*(){ yield { text:'INTERPRETER_AI_OK' }; })();
                        return Promise.resolve({ message:{ content:'INTERPRETER_AI_OK' } });
                      },
                      txt2speech(){ return Promise.reject(new Error('not used')); }
                    }
                  };
                `
              });
            });

            await page.goto('http://127.0.0.1:8765/interpreter_coach.html', {
              waitUntil:'domcontentloaded', timeout:60000
            });
            await page.waitForFunction(() => Boolean(window.puter?.ai?.chat), null, {
              timeout:10000
            });

            await page.evaluate(() => {
              window.InterpreterNative = {
                setVoiceLanguage(){},
                startVoiceInput(){ window.__voiceStarts = (window.__voiceStarts || 0) + 1; },
                stopVoiceInput(){},
                speakText(){ return false; },
                stopSpeaking(){},
                getPracticeContext(){ return 'No saved practice context.'; }
              };
            });

            await page.addScriptTag({
              path:path.join(process.env.GITHUB_WORKSPACE, 'app/src/main/assets/interpreter_professional_ai.js')
            });
            await page.addScriptTag({
              path:path.join(process.env.GITHUB_WORKSPACE, 'app/src/main/assets/interpreter_ai_provider.js')
            });
            await page.addScriptTag({
              path:path.join(process.env.GITHUB_WORKSPACE, 'app/src/main/assets/interpreter_ai_bootstrap.js')
            });
            await page.addScriptTag({
              path:path.join(process.env.GITHUB_WORKSPACE, 'app/src/main/assets/interpreter_fast_voice.js')
            });
            await page.addScriptTag({
              path:path.join(process.env.GITHUB_WORKSPACE, 'app/src/main/assets/interpreter_professional_voice.js')
            });

            const ready = await page.evaluate(() => ({
              bootstrap:Boolean(window.__interpreterAiBootstrapV5),
              provider:Boolean(window.__interpreterAiProviderV1),
              voice:Boolean(window.__fastInterpreterVoiceV4),
              professionalAi:Boolean(window.__interpreterProfessionalAiV1),
              professionalVoice:Boolean(window.__professionalInterpreterVoiceV1),
              status:document.getElementById('statusText')?.textContent || '',
              mic:Boolean(document.getElementById('voiceBtn')),
              live:Boolean(document.getElementById('voiceCallLaunch')),
              overlay:Boolean(document.getElementById('voiceCallOverlay'))
            }));
            if (!ready.bootstrap || !ready.provider || !ready.voice || !ready.professionalAi || !ready.professionalVoice) throw new Error('Professional AI/provider/voice layers did not load.');
            if (!ready.mic || !ready.live || !ready.overlay) throw new Error('Interpreter Live or microphone controls are missing.');
            if (!/tap Connect AI/i.test(ready.status)) throw new Error(`Professional AI connection prompt missing: ${ready.status}`);

            await page.fill('#chatInput', 'Confirm AI works.');
            await page.click('#sendBtn');
            await page.waitForFunction(() => window.__chatCalls.length === 1, null, { timeout:10000 });
            const result = await page.evaluate(() => ({
              chatCalls:window.__chatCalls,
              signInCalls:window.__signInCalls,
              signInActivation:window.__signInActivation,
              visible:Array.from(document.querySelectorAll('.message.assistant .bubble')).map(n => n.textContent || '')
            }));
            if (result.signInCalls !== 1) throw new Error(`Expected one explicit signIn call, got ${result.signInCalls}.`);
            if (!result.signInActivation) throw new Error('Puter signIn lost transient user activation.');
            if (result.chatCalls[0]?.options?.model !== 'qwen/qwen3.8-27b:free') {
              throw new Error(`Wrong model: ${result.chatCalls[0]?.options?.model}`);
            }
            if (!result.visible.some(text => text.includes('INTERPRETER_AI_OK'))) {
              throw new Error('AI response was not rendered in the coach.');
            }

            await page.click('#voiceCallLaunch');
            await page.waitForFunction(() => document.getElementById('voiceCallOverlay')?.classList.contains('active'), null, { timeout:5000 });
            const liveResult = await page.evaluate(() => ({
              active:document.getElementById('voiceCallOverlay')?.classList.contains('active') === true,
              starts:window.__voiceStarts || 0
            }));
            if (!liveResult.active) throw new Error('Interpreter Live overlay did not open.');
            if (liveResult.starts < 1) throw new Error('Interpreter Live did not start native microphone input.');

            await browser.close();
            console.log('Android professional AI first-turn and voice-control test passed.');
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

          cd /tmp/puter-ci
          node activation-test.cjs

  build:
    needs: puter-ai-browser-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install stable development signing key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/interpreter-debug.keystore"
          base64 --decode .github/interpreter-debug.keystore.b64 > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" \
            -storepass android -alias androiddebugkey >/dev/null
          echo "Stable Interpreter Trainer development signing key installed."

      - name: Guard Interpreter AI, Live, microphone and natural voice architecture
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/assets/interpreter_coach.html
          test -f app/src/main/assets/interpreter_professional_ai.js
          test -f app/src/main/assets/interpreter_ai_provider.js
          test -f app/src/main/assets/interpreter_ai_bootstrap.js
          test -f app/src/main/assets/interpreter_fast_voice.js
          test -f app/src/main/assets/interpreter_professional_voice.js
          test -f app/src/main/assets/interpreter_precise_barge_in.js
          test -f app/src/main/assets/interpreter_standard_arabic.js
          test -f app/src/main/java/com/interpretertrainer/app/speech/MicrophoneSessionCoordinator.kt
          test -f app/src/main/java/com/interpretertrainer/app/speech/NaturalAndroidVoice.kt
          test ! -f app/src/main/java/com/interpretertrainer/app/ai/OnDeviceInterpreterAi.kt
          test ! -f app/src/main/java/com/interpretertrainer/app/ai/OnDeviceModelManager.kt
          test ! -f app/src/main/java/com/interpretertrainer/app/ai/OnlineInterpreterAi.kt

          if grep -R -E "litertlm|LiteRT-LM|Install Interpreter AI|MODEL_DOWNLOAD_SIZE_LABEL|INTERPRETER_AI_BASE_URL" \
              app/src/main app/build.gradle.kts; then
            echo "Old local-model or placeholder-backend AI code must not return."
            exit 1
          fi

          grep -q "https://js.puter.com/v2/" app/src/main/assets/interpreter_coach.html
          grep -q "__loadInterpreterAiSdk" app/src/main/assets/interpreter_coach.html
          if grep -q '<script src="https://js.puter.com/v2/' app/src/main/assets/interpreter_coach.html; then
            echo "Puter must not block the local coach document during startup."
            exit 1
          fi
          grep -q "qwen/qwen3.8-27b:free" app/src/main/assets/interpreter_coach.html
          grep -q "puter.ai.txt2speech" app/src/main/assets/interpreter_coach.html
          grep -q "playNaturalInterpreterVoice" app/src/main/assets/interpreter_coach.html
          grep -q "__interpreterAiBootstrapV5" app/src/main/assets/interpreter_ai_bootstrap.js
          grep -q "__interpreterAiProviderV1" app/src/main/assets/interpreter_ai_provider.js
          grep -q "interpreter_ai_provider.js" app/src/main/java/com/interpretertrainer/app/ui/screens/AiCoachScreen.kt
          grep -q "__fastInterpreterVoiceV4" app/src/main/assets/interpreter_fast_voice.js
          grep -q "AIV6-PRO" app/src/main/assets/interpreter_ai_bootstrap.js
          grep -q "gpt-4o-mini-tts" app/src/main/assets/interpreter_professional_voice.js
          grep -q "voiceCallLaunch" app/src/main/assets/interpreter_ai_bootstrap.js
          grep -q "voiceCallOverlay" app/src/main/assets/interpreter_ai_bootstrap.js
          grep -q "voiceBtn" app/src/main/assets/interpreter_ai_bootstrap.js
          grep -q "voiceCallLaunch" app/src/main/java/com/interpretertrainer/app/ui/screens/AiCoachScreen.kt
          grep -q "voiceBtn" app/src/main/java/com/interpretertrainer/app/ui/screens/AiCoachScreen.kt
          if grep -q -E "qwen/qwen3.7-flash|qwen/qwen3.8-max" app/src/main/assets/interpreter_coach.html; then
            echo "Legacy Interpreter AI model routing is still present."
            exit 1
          fi
          grep -q "CoachChromeClient" app/src/main/java/com/interpretertrainer/app/ui/screens/AiCoachScreen.kt
          grep -q "loadDataWithBaseURL" app/src/main/java/com/interpretertrainer/app/ui/screens/AiCoachScreen.kt
          grep -q "runtimeAssets.html" app/src/main/java/com/interpretertrainer/app/ui/screens/AiCoachScreen.kt
          grep -q "onPageCommitVisible" app/src/main/java/com/interpretertrainer/app/ui/screens/AiCoachScreen.kt
          if grep -q "COACH_STARTUP_TIMEOUT_MS\|alpha(webAlpha)" app/src/main/java/com/interpretertrainer/app/ui/screens/AiCoachScreen.kt; then
            echo "The bundled coach must not be hidden behind a native readiness timeout."
            exit 1
          fi
          grep -q "mediaPlaybackRequiresUserGesture = false" app/src/main/java/com/interpretertrainer/app/ui/screens/AiCoachScreen.kt

          grep -q "android.speech.RecognitionService" app/src/main/AndroidManifest.xml
          grep -q "android.permission.RECORD_AUDIO" app/src/main/AndroidManifest.xml
          grep -q "MicrophoneSessionCoordinator" app/src/main/java/com/interpretertrainer/app/speech/SpeechRecognizerManager.kt
          grep -q "MicrophoneSessionCoordinator" app/src/main/java/com/interpretertrainer/app/media/ShadowingRecorder.kt
          grep -q "MicrophoneSessionCoordinator" app/src/main/java/com/interpretertrainer/app/ui/screens/AiCoachScreen.kt
          grep -q "NaturalAndroidVoice" app/src/main/java/com/interpretertrainer/app/ui/screens/ShadowingScreen.kt
          grep -q "NaturalAndroidVoice" app/src/main/java/com/interpretertrainer/app/ui/screens/AiCoachScreen.kt
          grep -q "interpreter_precise_barge_in.js" app/src/main/java/com/interpretertrainer/app/ui/screens/AiCoachScreen.kt
          grep -q "interpreter_professional_voice.js" app/src/main/java/com/interpretertrainer/app/ui/screens/AiCoachScreen.kt

          echo "Interpreter professional AI, microphone coordination and neural voice guards passed."

      - name: Run unit tests and Android lint
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug

      - name: Build debug and optimized preview packages
        env:
          INTERPRETER_VERSION_CODE: 100${{ github.run_number }}
          INTERPRETER_VERSION_NAME: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('1.0.0-preview.{0}', github.run_number) || '1.0.0-preview.ci' }}
          INTERPRETER_DEBUG_KEYSTORE: ${{ runner.temp }}/interpreter-debug.keystore
          INTERPRETER_RELEASE_KEYSTORE: ${{ runner.temp }}/interpreter-debug.keystore
          INTERPRETER_RELEASE_STORE_PASSWORD: android
          INTERPRETER_RELEASE_KEY_ALIAS: androiddebugkey
          INTERPRETER_RELEASE_KEY_PASSWORD: android
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease :app:bundleRelease

      - name: Verify package signatures
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          KEYSTORE="$RUNNER_TEMP/interpreter-debug.keystore"

          keytool -exportcert \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias androiddebugkey \
            -file /tmp/interpreter-debug-cert.der >/dev/null 2>&1
          EXPECTED_SHA256="$(sha256sum /tmp/interpreter-debug-cert.der | awk '{print tolower($1)}')"

          for APK in \
            app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/release/app-release.apk; do
            "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/apk-signing.txt
            ACTUAL_SHA256="$(awk -F': ' '/certificate SHA-256 digest:/ {print tolower($NF); exit}' /tmp/apk-signing.txt | tr -d '[:space:]')"
            if [ -z "$ACTUAL_SHA256" ] || [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
              echo "APK signing certificate mismatch for $APK."
              exit 1
            fi
          done
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab >/dev/null
          echo "APK and app-bundle signatures are valid for the public preview key."

      - name: Upload tested preview packages and reports
        uses: actions/upload-artifact@v4
        with:
          name: interpreter-trainer-preview-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: error

  publish-preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4

      - name: Download tested packages
        uses: actions/download-artifact@v4
        with:
          name: interpreter-trainer-preview-${{ github.sha }}
          path: dist

      - name: Publish tagged public preview
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v1.0.0-preview.${GITHUB_RUN_NUMBER}"
          APK="$(find dist -path '*/apk/release/app-release.apk' -type f -print -quit)"
          AAB="$(find dist -path '*/bundle/release/app-release.aab' -type f -print -quit)"
          test -n "$APK" && test -n "$AAB"
          cp "$APK" Interpreter-Trainer-${TAG}.apk
          cp "$AAB" Interpreter-Trainer-${TAG}.aab
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "Interpreter Trainer $TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --verify-tag \
            --prerelease \
            --title "Interpreter Trainer ${TAG}" \
            --notes-file docs/PREVIEW_RELEASE_NOTES.md \
            "Interpreter-Trainer-${TAG}.apk#Android APK (public preview signing key)" \
            "Interpreter-Trainer-${TAG}.aab#Android App Bundle (public preview signing key)"
