name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  puter-ai-browser-test:
    name: Verify live Qwen catalog and auth flow
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify live Puter model catalog contains Qwen3.6 27B
        shell: bash
        run: |
          set -euo pipefail
          curl --location --fail --silent --show-error --max-time 45 \
            https://api.puter.com/puterai/chat/models/details \
            --output /tmp/puter-models.json
          test -s /tmp/puter-models.json
          grep -q 'qwen/qwen3.6-27b' /tmp/puter-models.json
          echo "Qwen3.6 27B is present in Puter's live catalog."

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install headless Chromium
        working-directory: /tmp
        run: |
          mkdir -p /tmp/puter-ci
          cd /tmp/puter-ci
          npm init -y >/dev/null
          npm install --silent playwright@1.55.0
          npx playwright install chromium

      - name: Verify Puter SDK loads and opens official authentication
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/puter-ci/index.html <<'HTML'
          <!doctype html><html><body>
          <script src="https://js.puter.com/v2/"></script>
          <button id="run" onclick="puter.auth.signIn({ attempt_temp_user_creation: true })">Connect</button>
          </body></html>
          HTML

          python3 -m http.server 8765 --directory /tmp/puter-ci >/tmp/puter-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          cat > /tmp/puter-ci/test.cjs <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext();
            const page = await context.newPage();
            await page.goto('http://127.0.0.1:8765', { waitUntil: 'networkidle', timeout: 60000 });
            const sdkReady = await page.evaluate(() => Boolean(window.puter?.auth?.signIn && window.puter?.ai?.chat));
            if (!sdkReady) throw new Error('Puter.js AI/auth SDK did not load.');

            const popupPromise = page.waitForEvent('popup', { timeout: 30000 });
            await page.click('#run');
            const popup = await popupPromise;
            await popup.waitForLoadState('domcontentloaded', { timeout: 30000 }).catch(() => {});
            const url = popup.url();
            console.log('AUTH POPUP:', url);
            if (!url.startsWith('https://puter.com/action/sign-in')) {
              throw new Error(`Unexpected authentication URL: ${url}`);
            }
            if (!url.includes('attempt_temp_user_creation=true')) {
              throw new Error('Temporary-user onboarding flag is missing from auth flow.');
            }
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

          cd /tmp/puter-ci
          node test.cjs

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install stable development signing key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/interpreter-debug.keystore"
          base64 --decode .github/interpreter-debug.keystore.b64 > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" \
            -storepass android -alias androiddebugkey >/dev/null
          echo "Stable Interpreter Trainer development signing key installed."

      - name: Guard Interpreter AI, microphone and natural voice architecture
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/assets/interpreter_coach.html
          test -f app/src/main/java/com/interpretertrainer/app/speech/MicrophoneSessionCoordinator.kt
          test -f app/src/main/java/com/interpretertrainer/app/speech/NaturalAndroidVoice.kt
          test ! -f app/src/main/java/com/interpretertrainer/app/ai/OnDeviceInterpreterAi.kt
          test ! -f app/src/main/java/com/interpretertrainer/app/ai/OnDeviceModelManager.kt
          test ! -f app/src/main/java/com/interpretertrainer/app/ai/OnlineInterpreterAi.kt

          if grep -R -E "litertlm|LiteRT-LM|Install Interpreter AI|MODEL_DOWNLOAD_SIZE_LABEL|INTERPRETER_AI_BASE_URL" \
              app/src/main app/build.gradle.kts; then
            echo "Old local-model or placeholder-backend AI code must not return."
            exit 1
          fi

          grep -q "https://js.puter.com/v2/" app/src/main/assets/interpreter_coach.html
          grep -q "qwen/qwen3.6-27b" app/src/main/assets/interpreter_coach.html
          grep -q "puter.ai.txt2speech" app/src/main/assets/interpreter_coach.html
          grep -q "playNaturalInterpreterVoice" app/src/main/assets/interpreter_coach.html
          if grep -q -E "qwen/qwen3.7-flash|qwen/qwen3.8-max" app/src/main/assets/interpreter_coach.html; then
            echo "Legacy Interpreter AI model routing is still present."
            exit 1
          fi
          grep -q "attempt_temp_user_creation" app/src/main/assets/interpreter_coach.html
          grep -q "CoachChromeClient" app/src/main/java/com/interpretertrainer/app/ui/screens/AiCoachScreen.kt
          grep -q "mediaPlaybackRequiresUserGesture = false" app/src/main/java/com/interpretertrainer/app/ui/screens/AiCoachScreen.kt

          grep -q "android.speech.RecognitionService" app/src/main/AndroidManifest.xml
          grep -q "android.permission.RECORD_AUDIO" app/src/main/AndroidManifest.xml
          grep -q "MicrophoneSessionCoordinator" app/src/main/java/com/interpretertrainer/app/speech/SpeechRecognizerManager.kt
          grep -q "MicrophoneSessionCoordinator" app/src/main/java/com/interpretertrainer/app/media/ShadowingRecorder.kt
          grep -q "MicrophoneSessionCoordinator" app/src/main/java/com/interpretertrainer/app/ui/screens/AiCoachScreen.kt
          grep -q "NaturalAndroidVoice" app/src/main/java/com/interpretertrainer/app/ui/screens/ShadowingScreen.kt
          grep -q "NaturalAndroidVoice" app/src/main/java/com/interpretertrainer/app/ui/screens/AiCoachScreen.kt

          echo "Interpreter AI, microphone coordination and natural voice guards passed."

      - name: Test media link routing
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        env:
          INTERPRETER_VERSION_CODE: ${{ github.run_number }}
          INTERPRETER_DEBUG_KEYSTORE: ${{ runner.temp }}/interpreter-debug.keystore
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          KEYSTORE="$RUNNER_TEMP/interpreter-debug.keystore"

          keytool -exportcert \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias androiddebugkey \
            -file /tmp/interpreter-debug-cert.der >/dev/null 2>&1
          EXPECTED_SHA256="$(sha256sum /tmp/interpreter-debug-cert.der | awk '{print tolower($1)}')"

          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk \
            | tee /tmp/apk-signing.txt
          ACTUAL_SHA256="$(awk -F': ' '/certificate SHA-256 digest:/ {print tolower($NF); exit}' /tmp/apk-signing.txt | tr -d '[:space:]')"

          if [ -z "$ACTUAL_SHA256" ] || [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "APK signing certificate mismatch."
            echo "Expected: $EXPECTED_SHA256"
            echo "Actual:   ${ACTUAL_SHA256:-missing}"
            exit 1
          fi
          echo "APK signing certificate matches the stable Interpreter Trainer development key."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: interpreter-trainer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
