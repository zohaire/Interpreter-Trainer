name: Apply Qwen3.8 workspace upgrade

on:
  push:
    branches:
      - feature/qwen38-signbridge

permissions:
  contents: write

jobs:
  migrate-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/qwen38-signbridge
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply Qwen3.8 Max and universal attachments
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Keep every existing AI path on one model. This also catches the native WebView
          # enhancement script and the voice/bootstrap paths without rewriting those stable flows.
          for path in Path('app/src').rglob('*'):
              if not path.is_file() or path.suffix.lower() not in {'.kt', '.js', '.html'}:
                  continue
              text = path.read_text(encoding='utf-8')
              updated = text.replace('qwen/qwen3.6-27b', 'qwen/qwen3.8-max')
              updated = updated.replace('Qwen3.6 27B', 'Qwen3.8 Max')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          coach_path = Path('app/src/main/java/com/interpretertrainer/app/ui/screens/AiCoachScreen.kt')
          coach = coach_path.read_text(encoding='utf-8')

          if 'import android.net.Uri\n' not in coach:
              coach = coach.replace('import android.graphics.drawable.ColorDrawable\n', 'import android.graphics.drawable.ColorDrawable\nimport android.net.Uri\n', 1)
          if 'import android.webkit.ValueCallback\n' not in coach:
              coach = coach.replace('import android.webkit.JavascriptInterface\n', 'import android.webkit.JavascriptInterface\nimport android.webkit.ValueCallback\n', 1)

          anchor = '    val webViewRef = remember { mutableStateOf<WebView?>(null) }\n'
          file_state = '''    val webViewRef = remember { mutableStateOf<WebView?>(null) }\n    val fileCallbackRef = remember { mutableStateOf<ValueCallback<Array<Uri>>?>(null) }\n\n    val filePickerLauncher = rememberLauncherForActivityResult(\n        ActivityResultContracts.OpenMultipleDocuments()\n    ) { uris ->\n        fileCallbackRef.value?.onReceiveValue(uris.toTypedArray())\n        fileCallbackRef.value = null\n    }\n'''
          if 'val fileCallbackRef = remember' not in coach:
              if anchor not in coach:
                  raise SystemExit('AiCoachScreen webViewRef anchor changed')
              coach = coach.replace(anchor, file_state, 1)

          old_factory = '                createCoachWebView(webContext, bridge).also { webViewRef.value = it }\n'
          new_factory = '''                createCoachWebView(webContext, bridge) { callback ->\n                    fileCallbackRef.value?.onReceiveValue(null)\n                    fileCallbackRef.value = callback\n                    filePickerLauncher.launch(arrayOf("*/*"))\n                    true\n                }.also { webViewRef.value = it }\n'''
          if 'createCoachWebView(webContext, bridge) { callback ->' not in coach:
              if old_factory not in coach:
                  raise SystemExit('AiCoachScreen factory anchor changed')
              coach = coach.replace(old_factory, new_factory, 1)

          dispose_anchor = '        onDispose {\n            bridge.dispose()\n'
          dispose_new = '        onDispose {\n            fileCallbackRef.value?.onReceiveValue(null)\n            fileCallbackRef.value = null\n            bridge.dispose()\n'
          if 'fileCallbackRef.value?.onReceiveValue(null)\n            fileCallbackRef.value = null\n            bridge.dispose()' not in coach:
              if dispose_anchor not in coach:
                  raise SystemExit('AiCoachScreen dispose anchor changed')
              coach = coach.replace(dispose_anchor, dispose_new, 1)

          old_create = 'private fun createCoachWebView(context: Context, bridge: PracticeContextBridge): WebView {'
          new_create = '''private fun createCoachWebView(\n    context: Context,\n    bridge: PracticeContextBridge,\n    onFileChooser: (ValueCallback<Array<Uri>>) -> Boolean\n): WebView {'''
          if 'onFileChooser: (ValueCallback<Array<Uri>>) -> Boolean' not in coach:
              if old_create not in coach:
                  raise SystemExit('createCoachWebView signature anchor changed')
              coach = coach.replace(old_create, new_create, 1)

          if 'webView.webChromeClient = CoachChromeClient(context, onFileChooser)' not in coach:
              old = '    webView.webChromeClient = CoachChromeClient(context)\n'
              if old not in coach:
                  raise SystemExit('CoachChromeClient call anchor changed')
              coach = coach.replace(old, '    webView.webChromeClient = CoachChromeClient(context, onFileChooser)\n', 1)

          old_class = 'private class CoachChromeClient(private val context: Context) : WebChromeClient() {'
          new_class = '''private class CoachChromeClient(\n    private val context: Context,\n    private val onFileChooser: (ValueCallback<Array<Uri>>) -> Boolean\n) : WebChromeClient() {\n    override fun onShowFileChooser(\n        webView: WebView?,\n        filePathCallback: ValueCallback<Array<Uri>>?,\n        fileChooserParams: WebChromeClient.FileChooserParams?\n    ): Boolean {\n        val callback = filePathCallback ?: return false\n        return onFileChooser(callback)\n    }\n'''
          if 'override fun onShowFileChooser(' not in coach:
              if old_class not in coach:
                  raise SystemExit('CoachChromeClient class anchor changed')
              coach = coach.replace(old_class, new_class, 1)

          coach_path.write_text(coach, encoding='utf-8')

          html_path = Path('app/src/main/assets/interpreter_coach.html')
          html = html_path.read_text(encoding='utf-8')
          if 'interpreterAttachmentInput' not in html:
              attachment_script = r'''
<script id="universal-attachment-support">
(() => {
  const readableExtensions = new Set(['txt','md','markdown','csv','tsv','json','xml','yaml','yml','srt','vtt','log','html','htm','css','js','mjs','ts','tsx','jsx','kt','java','py','rb','go','rs','c','cpp','h','hpp','sql','ini','toml','properties']);
  let attachments = [];
  const composer = document.querySelector('.composer');
  const sendButton = document.getElementById('sendBtn');
  if (!composer || !sendButton) return;

  const style = document.createElement('style');
  style.textContent = `.attachment-btn{color:var(--accent)!important}.attachment-strip{width:min(780px,100%);margin:0 auto 7px;display:none;gap:6px;flex-wrap:wrap}.attachment-strip.show{display:flex}.attachment-chip{max-width:46%;padding:6px 9px;border:1px solid var(--border);border-radius:999px;background:var(--surface-soft);color:var(--muted);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}`;
  document.head.appendChild(style);

  const input = document.createElement('input');
  input.id = 'interpreterAttachmentInput';
  input.type = 'file';
  input.accept = '*/*';
  input.multiple = true;
  input.hidden = true;
  document.body.appendChild(input);

  const attach = document.createElement('button');
  attach.type = 'button';
  attach.className = 'icon-btn attachment-btn';
  attach.title = 'Attach files';
  attach.setAttribute('aria-label', 'Attach files of any type');
  attach.textContent = '+';
  attach.onclick = () => input.click();
  composer.insertBefore(attach, sendButton);

  const strip = document.createElement('div');
  strip.className = 'attachment-strip';
  document.querySelector('.composer-shell')?.insertBefore(strip, composer);

  const redraw = () => {
    strip.innerHTML = '';
    strip.classList.toggle('show', attachments.length > 0);
    attachments.forEach(file => {
      const chip = document.createElement('div');
      chip.className = 'attachment-chip';
      chip.textContent = `${file.name} · ${Math.max(1, Math.round(file.size / 1024))} KB`;
      strip.appendChild(chip);
    });
  };

  input.onchange = () => {
    attachments = [...input.files];
    redraw();
    input.value = '';
  };

  const isTextLike = file => {
    const ext = (file.name.split('.').pop() || '').toLowerCase();
    return file.type.startsWith('text/') || readableExtensions.has(ext) || file.type.includes('json') || file.type.includes('xml');
  };

  const attachmentContext = async () => {
    if (!attachments.length) return '';
    const blocks = [];
    for (const file of attachments) {
      const header = `[Attached file: ${file.name}; type=${file.type || 'unknown'}; size=${file.size} bytes]`;
      if (isTextLike(file) && file.size <= 6_000_000) {
        try {
          const body = (await file.text()).slice(0, 120000);
          blocks.push(`${header}\n${body}`);
          continue;
        } catch (_) {}
      }
      blocks.push(`${header}\nThe file is attached in the app, but this binary format is not converted to text locally. Do not pretend to have read binary contents that are not present in the prompt.`);
    }
    return `\n\n--- ATTACHMENTS ---\n${blocks.join('\n\n')}\n--- END ATTACHMENTS ---`;
  };

  let wrappedFunction = null;
  const installSendWrapper = () => {
    const current = window.sendChat;
    if (typeof current !== 'function' || current === wrappedFunction) return;
    const original = current;
    wrappedFunction = async function(...args) {
      if (attachments.length) {
        const chatInput = document.getElementById('chatInput');
        if (chatInput) {
          const context = await attachmentContext();
          chatInput.value = `${chatInput.value || ''}${context}`;
          window.resizeComposer?.();
          window.updateSendState?.();
          attachments = [];
          redraw();
        }
      }
      return original.apply(this, args);
    };
    window.sendChat = wrappedFunction;
  };

  installSendWrapper();
  let attempts = 0;
  const installer = setInterval(() => {
    installSendWrapper();
    attempts += 1;
    if (attempts > 28) clearInterval(installer);
  }, 250);
})();
</script>
'''
              if '</body>' not in html:
                  raise SystemExit('interpreter_coach.html missing body close')
              html = html.replace('</body>', attachment_script + '\n</body>', 1)
              html_path.write_text(html, encoding='utf-8')

          leftovers = []
          for path in Path('app/src').rglob('*'):
              if path.is_file() and path.suffix.lower() in {'.kt','.js','.html'}:
                  if 'qwen/qwen3.6-27b' in path.read_text(encoding='utf-8'):
                      leftovers.append(str(path))
          if leftovers:
              raise SystemExit('Old Qwen model remains in: ' + ', '.join(leftovers))
          PY

      - name: Verify migration markers
        run: |
          grep -R "qwen/qwen3.8-max" app/src/main/assets app/src/main/java/com/interpretertrainer/app/ui/screens/AiCoachScreen.kt
          ! grep -R "qwen/qwen3.6-27b" app/src/main
          grep -q "interpreterAttachmentInput" app/src/main/assets/interpreter_coach.html
          grep -q "onShowFileChooser" app/src/main/java/com/interpretertrainer/app/ui/screens/AiCoachScreen.kt

      - name: Build and run unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Commit verified migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/interpreter_ai_bootstrap.js app/src/main/assets/interpreter_coach.html app/src/main/java/com/interpretertrainer/app/ui/screens/AiCoachScreen.kt
          if ! git diff --cached --quiet; then
            git commit -m "Upgrade Interpreter AI to Qwen3.8 Max and universal attachments"
            git push origin HEAD:feature/qwen38-signbridge
          fi
