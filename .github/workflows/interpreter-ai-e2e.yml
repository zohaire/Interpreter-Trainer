name: Authenticated Interpreter AI integration
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  browser-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Backend behavior tests
        run: node --test backend/test/*.test.mjs
      - name: Install browser test runtime
        run: |
          npm install --prefix /tmp/coach-ci playwright@1.55.0
          /tmp/coach-ci/node_modules/.bin/playwright install --with-deps chromium
      - name: Exercise actual coach document and Android-injected JavaScript
        env:
          NODE_PATH: /tmp/coach-ci/node_modules
        run: node .github/tests/interpreter-backend-runtime.cjs
      - name: Validation boundary
        run: echo 'Backend and browser tests simulate external providers and Firebase tokens. Live Firebase, Facebook and deployed provider checks remain release gates.' >> "$GITHUB_STEP_SUMMARY"
