name: Remove remaining Puter AI

on:
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: write

jobs:
  migrate-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/qwen38-signbridge
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply final paid-route cleanup
        run: python3 tools/remove_all_remaining_puter_ai.py

      - name: Verify zero Puter AI calls
        shell: bash
        run: |
          set -euo pipefail
          node --check app/src/main/assets/interpreter_ai_bootstrap.js
          node --check app/src/main/assets/interpreter_fast_voice.js
          node --check app/src/main/assets/interpreter_precise_barge_in.js
          node --check app/src/main/assets/interpreter_live_latency.js
          node --check app/src/main/assets/interpreter_standard_arabic.js
          if grep -R -nE 'puter\.ai\.(chat|speech2txt|txt2speech)' app/src/main; then
            echo 'Paid Puter AI routing remains.'
            exit 1
          fi
          grep -q 'installProviderGuard' app/src/main/assets/interpreter_standard_arabic.js
          grep -q 'installLatencyGuard' app/src/main/assets/interpreter_live_latency.js
          grep -q "model:'gemini-3.7-flash'" app/src/main/assets/interpreter_fast_voice.js
          grep -q "model:'gemini-3.7-flash'" app/src/main/java/com/interpretertrainer/app/ui/screens/AiCoachScreen.kt

      - name: Run Android tests and build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Commit verified application changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            app/src/main/java/com/interpretertrainer/app/ui/screens/AiCoachScreen.kt \
            app/src/main/assets/interpreter_ai_bootstrap.js \
            app/src/main/assets/interpreter_standard_arabic.js \
            app/src/main/assets/interpreter_live_latency.js
          if ! git diff --cached --quiet; then
            git commit -m "Remove all remaining paid Puter AI paths"
            git pull --rebase origin feature/qwen38-signbridge
            git push origin HEAD:feature/qwen38-signbridge
          fi
