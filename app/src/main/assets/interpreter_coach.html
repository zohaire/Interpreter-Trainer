<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <script src="https://js.puter.com/v2/"></script>
  <style>
    :root {
      --bg:#f4f7fc;--surface:#fff;--soft:#eef4fc;--surface-soft:#eef4fc;--surface-strong:#dfeafa;
      --text:#0b1f3a;--muted:#65758b;--faint:#8b99ac;--accent:#1768f2;--accent2:#22b8cf;
      --accent-soft:#e8f1ff;--accent-ink:#0e52c4;--border:#dce6f2;--danger:#c9362b;--ok:#138a55;
      --user:#1768f2;--shadow:0 20px 60px rgba(12,43,86,.12)
    }
    @media(prefers-color-scheme:dark){:root{--bg:#071222;--surface:#0e1b2d;--soft:#14253a;--surface-soft:#14253a;--surface-strong:#203650;--text:#f3f7fc;--muted:#a9b8ca;--faint:#788ca4;--accent:#66a4ff;--accent2:#55d8e8;--accent-soft:#142f55;--accent-ink:#a8cbff;--border:#233a54;--danger:#ffb4ac;--ok:#72dfa6;--user:#286fda;--shadow:0 20px 60px rgba(0,0,0,.34)}}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}body{overflow:hidden}button,textarea,select{font:inherit}button{-webkit-tap-highlight-color:transparent}
    .app{height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(circle at 88% 0%,color-mix(in srgb,var(--accent2) 11%,transparent),transparent 34%),radial-gradient(circle at 5% 22%,color-mix(in srgb,var(--accent) 9%,transparent),transparent 29%),var(--bg)}
    .top-shell{padding:10px 12px 5px;z-index:9}.topline{width:min(780px,100%);margin:auto;min-height:62px;display:flex;align-items:center;justify-content:space-between;padding:10px 11px 10px 12px;border:1px solid color-mix(in srgb,var(--border) 80%,transparent);border-radius:20px;background:color-mix(in srgb,var(--surface) 91%,transparent);box-shadow:0 10px 35px rgba(12,43,86,.08);backdrop-filter:blur(18px)}
    .identity{display:flex;align-items:center;gap:10px;min-width:0}.ai-mark,.avatar{display:grid;place-items:center;flex:0 0 auto;color:#fff;font-weight:850;background:linear-gradient(145deg,var(--accent),var(--accent2));box-shadow:0 8px 25px color-mix(in srgb,var(--accent) 24%,transparent)}.ai-mark{width:40px;height:40px;border-radius:15px;font-size:11px;letter-spacing:.5px}.avatar{width:31px;height:31px;border-radius:11px;font-size:9px}.identity-title{font-size:14px;font-weight:800;letter-spacing:-.1px}.identity-kicker{margin-top:1px;font-size:10px;color:var(--accent-ink);font-weight:720}.status-line{display:flex;align-items:center;gap:6px;margin-top:3px;color:var(--muted);font-size:10.5px}.status-dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}.status-dot.ok{background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 12%,transparent)}.status-dot.bad{background:var(--danger)}
    .icon-btn{width:39px;height:39px;border:1px solid transparent;border-radius:13px;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer}.icon-btn:hover{background:var(--soft);color:var(--text)}.icon-btn svg{width:20px;height:20px}.pane{flex:1;min-height:0;display:flex;flex-direction:column}.chat-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}.chat-inner{width:min(780px,100%);margin:auto;padding:12px 14px 25px}
    .welcome{position:relative;overflow:hidden;margin:5px 0 22px;padding:24px 21px 20px;border-radius:25px;color:#fff;background:linear-gradient(135deg,#071d48 0%,#114ba5 54%,#168ba7 100%);box-shadow:0 24px 60px rgba(8,43,98,.22);text-align:left}.welcome::after{content:"";position:absolute;width:190px;height:190px;right:-65px;top:-90px;border-radius:50%;border:30px solid rgba(255,255,255,.08)}.welcome-mark{width:48px;height:48px;display:grid;place-items:center;border-radius:17px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(10px)}.wave-glyph{width:28px;height:28px;display:block}.welcome h1{position:relative;margin:17px 0 0;max-width:540px;font-size:25px;line-height:1.14;letter-spacing:-.55px}.welcome p{position:relative;max-width:600px;margin:9px 0 0;color:rgba(255,255,255,.79);font-size:13.5px;line-height:1.55}.suggestions{position:relative;display:flex;flex-wrap:wrap;gap:7px;margin-top:18px}.suggestion{border:1px solid rgba(255,255,255,.23);border-radius:999px;padding:8px 11px;background:rgba(255,255,255,.11);color:#fff;font-size:11.5px;font-weight:650;cursor:pointer;backdrop-filter:blur(8px)}.suggestion:active{transform:scale(.98)}
    .messages{display:flex;flex-direction:column;gap:17px}.message{display:flex;align-items:flex-start;gap:10px}.message.user{justify-content:flex-end;padding-left:45px}.message.assistant{padding-right:10px}.message-body{min-width:0;max-width:min(660px,calc(100vw - 72px))}.bubble{overflow-wrap:anywhere;font-size:14.2px;line-height:1.62}.user .bubble{padding:10px 14px;border-radius:19px 19px 6px 19px;color:#fff;background:linear-gradient(145deg,var(--user),color-mix(in srgb,var(--user) 72%,var(--accent2)));white-space:pre-wrap;box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 18%,transparent)}.assistant .message-body{padding:12px 13px 8px;border:1px solid var(--border);border-radius:8px 20px 20px 20px;background:color-mix(in srgb,var(--surface) 94%,transparent);box-shadow:0 8px 28px rgba(12,43,86,.07)}.bubble p{margin:0 0 10px}.bubble p:last-child{margin-bottom:0}.bubble h2,.bubble h3{margin:14px 0 7px}.bubble h2{font-size:16px}.bubble h3{font-size:14.5px}.bubble ul,.bubble ol{padding-left:21px}.bubble code{padding:2px 5px;border-radius:6px;background:var(--soft)}
    .message-actions{display:flex;gap:4px;align-items:center;min-height:28px;margin-top:6px;flex-wrap:wrap}.message-action{border:0;border-radius:9px;padding:5px 7px;background:transparent;color:var(--faint);font-size:10.5px;cursor:pointer}.message-action:hover{background:var(--soft);color:var(--accent-ink)}.typing-row{display:flex;align-items:center;gap:10px;margin-top:15px}.typing{display:flex;gap:4px;align-items:center;height:30px}.typing span{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:bounce 1.15s infinite ease-in-out}.typing span:nth-child(2){animation-delay:.13s}.typing span:nth-child(3){animation-delay:.26s}
    .chat-error{width:min(780px,100%);min-height:17px;margin:auto;padding:0 14px;color:var(--danger);font-size:12px}.composer-shell{padding:5px 12px max(10px,env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 72%,color-mix(in srgb,var(--bg) 75%,transparent));z-index:7}.composer{width:min(780px,100%);margin:auto;display:flex;align-items:flex-end;gap:7px;padding:7px 7px 7px 13px;border:1px solid color-mix(in srgb,var(--accent) 18%,var(--border));border-radius:23px;background:var(--surface);box-shadow:var(--shadow)}#chatInput{flex:1;min-width:0;min-height:38px;max-height:150px;border:0;outline:0;resize:none;overflow-y:auto;padding:8px 2px 7px;background:transparent;color:var(--text);font-size:14.5px;line-height:1.45}.send-btn{width:39px;height:39px;border:0;border-radius:14px;display:grid;place-items:center;flex:0 0 auto;background:linear-gradient(145deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 22%,transparent)}.send-btn:disabled{opacity:.34;box-shadow:none}.send-btn svg{width:18px;height:18px}.composer-meta{width:min(780px,100%);margin:7px auto 0;text-align:center;color:var(--faint);font-size:10px}
    @keyframes bounce{0%,70%,100%{transform:translateY(0);opacity:.45}35%{transform:translateY(-4px);opacity:1}}@media(max-width:620px){.message.user{padding-left:28px}.welcome{padding:21px 17px 18px}.welcome h1{font-size:23px}}
  </style>
</head>
<body>
<div class="app">
  <div class="top-shell"><header class="topline">
    <div class="identity"><div class="ai-mark">IT</div><div><div class="identity-title">Interpreter AI</div><div class="identity-kicker">Practice studio</div><div class="status-line"><span id="statusDot" class="status-dot"></span><span id="statusText">Checking connection…</span></div></div></div>
    <button class="icon-btn" type="button" aria-label="New chat" title="New chat" onclick="newChat()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg></button>
  </header></div>
  <section id="chatPane" class="pane">
    <div id="chatScroll" class="chat-scroll"><div class="chat-inner">
      <div id="welcome" class="welcome"><div class="welcome-mark"><svg class="wave-glyph" viewBox="0 0 48 48" fill="none" stroke="white" stroke-width="3.2" stroke-linecap="round"><path d="M8 26v-4"/><path d="M15 32V16"/><path d="M22 37V11"/><path d="M29 32V16"/><path d="M36 27v-6"/><path d="M42 25v-2"/></svg></div><h1>A focused AI workspace for interpreters.</h1><p>Ask questions, build tailored drills, explore terminology, or move a useful passage directly into a practice mode.</p><div class="suggestions"><button class="suggestion" onclick="useSuggestion('Give me a 10-minute consecutive interpreting drill for today.')">10-minute drill</button><button class="suggestion" onclick="useSuggestion('Give me a simultaneous interpreting passage on diplomacy.')">Diplomacy passage</button><button class="suggestion" onclick="useSuggestion('Give me a shadowing exercise in French.')">French shadowing</button></div></div>
      <div id="messages" class="messages" aria-live="polite"></div><div id="typingHost"></div>
    </div></div>
    <div id="chatError" class="chat-error" role="alert"></div>
    <div class="composer-shell"><div class="composer"><textarea id="chatInput" rows="1" maxlength="4000" placeholder="Message Interpreter AI" aria-label="Message Interpreter AI"></textarea><button id="sendBtn" class="send-btn" type="button" aria-label="Send message" onclick="sendChat()" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button></div><div class="composer-meta">Qwen3.6 27B · online AI · verify critical source facts</div></div>
  </section>
</div>
<script>
  const AI_MODEL='qwen/qwen3.6-27b',CHAT_MODEL=AI_MODEL,HISTORY_KEY='interpreterCoachHistoryV4';let history=loadHistory(),busy=false;const $=id=>document.getElementById(id);
  function nativePracticeContext(){try{return window.InterpreterNative?.getPracticeContext?.()||'No saved practice context.'}catch(_){return'No saved practice context.'}}
  function loadHistory(){try{const p=JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');return Array.isArray(p)?p.filter(x=>x&&['user','assistant'].includes(x.role)&&typeof x.content==='string').slice(-20):[]}catch(_){return[]}}
  function saveHistory(){try{localStorage.setItem(HISTORY_KEY,JSON.stringify(history.slice(-20)))}catch(_){}}
  function setStatus(text,state='idle'){$('statusText').textContent=text;$('statusDot').className='status-dot'+(state==='ok'?' ok':state==='bad'?' bad':'')}
  function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
  function inlineMarkdown(v){return escapeHtml(v).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')}
  function renderRichText(container,text){container.innerHTML='';const lines=String(text).replace(/\r/g,'').split('\n');let list=null,listType='';for(const raw of lines){const t=raw.trim();if(!t){list=null;listType='';continue}if(t.startsWith('### ')){const h=document.createElement('h3');h.innerHTML=inlineMarkdown(t.slice(4));container.appendChild(h);list=null;continue}if(t.startsWith('## ')||t.startsWith('# ')){const h=document.createElement('h2');h.innerHTML=inlineMarkdown(t.slice(t.startsWith('## ')?3:2));container.appendChild(h);list=null;continue}const b=t.match(/^[-*]\s+(.+)/),n=t.match(/^\d+[.)]\s+(.+)/);if(b||n){const wanted=n?'ol':'ul';if(!list||listType!==wanted){list=document.createElement(wanted);listType=wanted;container.appendChild(list)}const li=document.createElement('li');li.innerHTML=inlineMarkdown((b||n)[1]);list.appendChild(li);continue}list=null;const p=document.createElement('p');p.innerHTML=inlineMarkdown(t);container.appendChild(p)}}
  function messageElement(role,text,options={}){const row=document.createElement('div');row.className='message '+role;if(role==='assistant'){const a=document.createElement('div');a.className='avatar';a.textContent='IT';row.appendChild(a)}const body=document.createElement('div');body.className='message-body';const bubble=document.createElement('div');bubble.className='bubble';role==='assistant'?renderRichText(bubble,text):bubble.textContent=text;body.appendChild(bubble);if(role==='assistant'&&!options.historical){const actions=document.createElement('div');actions.className='message-actions';const copy=document.createElement('button');copy.className='message-action';copy.type='button';copy.textContent='Copy';copy.onclick=async()=>{try{await navigator.clipboard.writeText(text);copy.textContent='Copied'}catch(_){copy.textContent='Copy failed'}setTimeout(()=>copy.textContent='Copy',1100)};actions.appendChild(copy);body.appendChild(actions)}row.appendChild(body);return row}
  function addMessage(role,text,options={}){$('welcome').hidden=true;$('messages').appendChild(messageElement(role,text,options));requestAnimationFrame(scrollToBottom)}
  function renderHistory(){$('messages').innerHTML='';$('welcome').hidden=history.length>0;history.forEach(x=>addMessage(x.role,x.content,{historical:true}));scrollToBottom(false)}
  function scrollToBottom(smooth=true){const s=$('chatScroll');s.scrollTo({top:s.scrollHeight,behavior:smooth?'smooth':'auto'})}
  function showTyping(){$('typingHost').innerHTML='<div class="typing-row"><div class="avatar">IT</div><div class="typing"><span></span><span></span><span></span></div></div>';requestAnimationFrame(scrollToBottom)}
  function hideTyping(){$('typingHost').innerHTML=''}
  function responseText(r){if(typeof r==='string')return r.trim();const c=r?.message?.content;if(typeof c==='string')return c.trim();if(Array.isArray(c))return c.map(p=>typeof p==='string'?p:(p?.text||'')).join('').trim();return typeof r?.text==='string'?r.text.trim():''}
  async function connectAi(){if(!window.puter){setStatus('No internet connection','bad');return false}try{if(!puter.auth.isSignedIn()){setStatus('Connecting…');await puter.auth.signIn({attempt_temp_user_creation:true})}setStatus('Online · ready','ok');return true}catch(e){setStatus('Connection needed','bad');$('chatError').textContent='Could not connect: '+(e?.message||e);return false}}
  async function ensureConnected(){if(window.puter&&puter.auth.isSignedIn()){setStatus('Online · ready','ok');return true}return connectAi()}
  function updateSendState(){$('sendBtn').disabled=busy||!$('chatInput').value.trim()}
  function resizeComposer(){const i=$('chatInput');i.style.height='auto';i.style.height=Math.min(i.scrollHeight,150)+'px'}
  function useSuggestion(text){$('chatInput').value=text;resizeComposer();updateSendState();sendChat()}
  async function sendChat(){if(busy)return;const input=$('chatInput'),text=input.value.trim();if(!text)return;$('chatError').textContent='';addMessage('user',text);input.value='';resizeComposer();updateSendState();if(!(await ensureConnected()))return;busy=true;updateSendState();showTyping();try{const system=`You are Interpreter AI, a fast professional coach for interpreters working especially in Arabic, English and French. Respond naturally and directly.\n\n${nativePracticeContext()}`;const r=await puter.ai.chat([{role:'system',content:system},...history.slice(-8),{role:'user',content:text}],{model:CHAT_MODEL,max_tokens:650,temperature:.24});const answer=responseText(r);if(!answer)throw new Error('Empty response');history.push({role:'user',content:text},{role:'assistant',content:answer});history=history.slice(-20);saveHistory();hideTyping();addMessage('assistant',answer);setStatus('Online · ready','ok')}catch(e){hideTyping();$('chatError').textContent='Interpreter AI could not answer: '+(e?.message||e);setStatus('Request failed','bad')}finally{busy=false;updateSendState()}}
  function newChat(){history=[];saveHistory();$('messages').innerHTML='';$('typingHost').innerHTML='';$('chatError').textContent='';$('welcome').hidden=false;$('chatInput').value='';resizeComposer();updateSendState()}
  function initialize(){renderHistory();const input=$('chatInput');input.addEventListener('input',()=>{resizeComposer();updateSendState()});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendChat()}});resizeComposer();updateSendState();if(!window.puter)setStatus('No internet connection','bad');else if(puter.auth.isSignedIn())setStatus('Online · ready','ok');else setStatus('Ready to connect')}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',initialize);else initialize();
</script>
</body>
</html>
