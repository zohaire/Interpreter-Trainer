name: Add free Gemini failover

on:
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: write

jobs:
  migrate-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/qwen38-signbridge
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Apply automatic free-model failover
        run: python3 tools/add_free_gemini_failover.py

      - name: Verify failover routing
        shell: bash
        run: |
          set -euo pipefail
          grep -q "gemini-3.7-flash','gemini-3.6-flash','gemini-3.5-flash','gemini-3.5-flash-lite" app/src/main/assets/interpreter_coach.html
          grep -q "switching to '+label" app/src/main/assets/interpreter_coach.html
          grep -q "response.status===429" app/src/main/assets/interpreter_coach.html
          grep -q "response.status>=500" app/src/main/assets/interpreter_coach.html
          grep -q "automatic Gemini fallback" app/src/main/assets/interpreter_coach.html
          ! grep -R -qE 'puter\.ai\.(chat|speech2txt|txt2speech)' app/src/main

      - name: Run Android tests and build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Commit verified app change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/interpreter_coach.html
          if ! git diff --cached --quiet; then
            git commit -m "Add automatic free Gemini model failover"
            git pull --rebase origin feature/qwen38-signbridge
            git push origin HEAD:feature/qwen38-signbridge
          fi
