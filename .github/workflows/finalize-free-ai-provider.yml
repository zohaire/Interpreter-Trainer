name: Finalize free AI provider

on:
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: write

jobs:
  finalize-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/qwen38-signbridge
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply final payment-free routing
        run: python3 tools/finalize_free_ai_provider.py

      - name: Validate JavaScript and permanent CI
        shell: bash
        run: |
          set -euo pipefail
          node --check app/src/main/assets/interpreter_ai_bootstrap.js
          node --check app/src/main/assets/interpreter_fast_voice.js
          node --check app/src/main/assets/interpreter_precise_barge_in.js
          grep -q "FREE_AI_MODEL='gemini-3.7-flash'" app/src/main/assets/interpreter_coach.html
          grep -q "model:'gemini-3.7-flash'" app/src/main/assets/interpreter_fast_voice.js
          ! grep -R -qE 'puter\.ai\.(chat|speech2txt|txt2speech)' app/src/main
          ! grep -q 'js.puter.com' app/src/main/assets/interpreter_coach.html
          ! grep -q 'qwen/qwen3.8-max' app/src/main/assets/interpreter_fast_voice.js
          grep -q 'free-ai-browser-test:' .github/workflows/android-debug-apk.yml

      - name: Run Android tests and build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Commit verified production changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            app/src/main/assets/interpreter_coach.html \
            app/src/main/assets/interpreter_fast_voice.js \
            .github/workflows/android-debug-apk.yml
          if ! git diff --cached --quiet; then
            git commit -m "Remove remaining paid Puter AI routing"
            git pull --rebase origin feature/qwen38-signbridge
            git push origin HEAD:feature/qwen38-signbridge
          fi
