name: Apply attachment reading fix

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/qwen38-signbridge

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: github.event_name == 'push' || github.head_ref == 'feature/qwen38-signbridge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/qwen38-signbridge
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply guarded attachment reading fix
        run: |
          python3 tools/fix_ai_attachment_reading.py
          python3 tools/limit_qwen_native_attachments.py

      - name: Verify attachment pipeline
        shell: bash
        run: |
          set -euo pipefail
          FILE=app/src/main/assets/interpreter_coach.html
          grep -q "DOC_READER_MODEL='claude-sonnet-4-6'" "$FILE"
          grep -q "puter.ai.speech2txt" "$FILE"
          grep -q "item.localText" "$FILE"
          grep -q "extracted or transcribed for reliable reading" "$FILE"
          grep -q "ready.filter(item=>item.kind==='vision')" "$FILE"
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('app/src/main/assets/interpreter_coach.html').read_text(encoding='utf-8')
          match=re.search(r'<script id="universal-attachment-support">(.*?)</script>',html,flags=re.S)
          assert match, 'Attachment script not found'
          script=match.group(1)
          assert "puter.ai.speech2txt" in script
          assert "DOC_READER_MODEL='claude-sonnet-4-6'" in script
          assert "ready.filter(item=>item.kind==='vision')" in script
          Path('/tmp/interpreter-attachment-script.js').write_text(script,encoding='utf-8')
          PY
          node --check /tmp/interpreter-attachment-script.js

      - name: Commit verified production change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/src/main/assets/interpreter_coach.html
          if ! git diff --cached --quiet; then
            git commit -m "Make Interpreter AI read uploaded documents"
            git push origin HEAD:feature/qwen38-signbridge
          fi
