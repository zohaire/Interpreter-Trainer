name: Interpreter AI Integration

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - "app/src/main/assets/interpreter_coach.html"
      - "app/src/main/assets/interpreter_ai_bootstrap.js"
      - "app/src/main/java/com/interpretertrainer/app/ui/screens/AiCoachScreen.kt"
      - "app/src/main/java/com/interpretertrainer/app/ui/screens/ResponsiveAiCoachScreen.kt"
      - ".github/workflows/interpreter-ai-e2e.yml"

jobs:
  browser-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate bundled Interpreter AI files
        shell: bash
        run: |
          set -euo pipefail
          node --check app/src/main/assets/interpreter_ai_bootstrap.js
          grep -q 'interpreter_ai_bootstrap.js' app/src/main/java/com/interpretertrainer/app/ui/screens/ResponsiveAiCoachScreen.kt
          grep -q 'qwen/qwen3.6-27b' app/src/main/assets/interpreter_coach.html

      - name: Verify Qwen3.6 27B remains in Puter live catalog
        shell: bash
        run: |
          set -euo pipefail
          curl --location --fail --silent --show-error \
            --retry 3 --retry-delay 2 --max-time 45 \
            https://api.puter.com/puterai/chat/models/details \
            --output /tmp/puter-models.json
          test -s /tmp/puter-models.json
          grep -q 'qwen/qwen3.6-27b' /tmp/puter-models.json
          echo 'Qwen3.6 27B is available in the live Puter catalog.'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/interpreter-ai-test
          cd /tmp/interpreter-ai-test
          npm init -y >/dev/null
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Test Android coach auth gesture and Qwen request path
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --directory "$GITHUB_WORKSPACE/app/src/main/assets" >/tmp/interpreter-ai-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          cat > /tmp/interpreter-ai-test/test.cjs <<'NODE'
          const { chromium } = require('playwright');
          const path = require('path');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();

            await page.route('https://js.puter.com/v2/**', async route => {
              await route.fulfill({
                status: 200,
                contentType: 'application/javascript',
                body: `
                  window.__mockSigned = false;
                  window.__signInCalls = 0;
                  window.__signInHadUserActivation = false;
                  window.__chatCalls = [];
                  window.puter = {
                    auth: {
                      isSignedIn() { return window.__mockSigned === true; },
                      async signIn() {
                        window.__signInCalls += 1;
                        window.__signInHadUserActivation = Boolean(navigator.userActivation?.isActive);
                        window.__mockSigned = true;
                        return { username: 'temporary-test-user', is_temp: true };
                      }
                    },
                    ai: {
                      async chat(messages, options) {
                        window.__chatCalls.push({ messages, options });
                        return { message: { content: 'INTERPRETER_AI_OK' } };
                      },
                      async txt2speech() { throw new Error('not used in this test'); }
                    }
                  };
                `
              });
            });

            await page.goto('http://127.0.0.1:8765/interpreter_coach.html', {
              waitUntil: 'domcontentloaded',
              timeout: 60000
            });

            const bootstrap = path.join(
              process.env.GITHUB_WORKSPACE,
              'app/src/main/assets/interpreter_ai_bootstrap.js'
            );
            const bootstrapResult = await page.addScriptTag({ path: bootstrap });
            await page.waitForTimeout(400);

            const automaticAuthCalls = await page.evaluate(() => window.__signInCalls);
            if (automaticAuthCalls !== 0) {
              throw new Error(`AI authentication started without a user gesture (${automaticAuthCalls} calls).`);
            }

            const initialStatus = await page.locator('#statusText').textContent();
            if (!/send to start|online/i.test(initialStatus || '')) {
              throw new Error(`Unexpected initial AI status: ${initialStatus}`);
            }

            await page.fill('#chatInput', 'Confirm the interpreter coach works.');
            await page.click('#sendBtn');
            await page.waitForFunction(() =>
              Array.from(document.querySelectorAll('.message.assistant .bubble'))
                .some(node => (node.textContent || '').includes('INTERPRETER_AI_OK')),
              null,
              { timeout: 10000 }
            );

            const first = await page.evaluate(() => ({
              signInCalls: window.__signInCalls,
              userActivation: window.__signInHadUserActivation,
              chatCalls: window.__chatCalls,
              status: document.getElementById('statusText')?.textContent || '',
              error: document.getElementById('chatError')?.textContent || ''
            }));

            if (first.signInCalls !== 1) throw new Error(`Expected one auth attempt, got ${first.signInCalls}.`);
            if (!first.userActivation) throw new Error('Puter signIn was not initiated under a real user activation.');
            if (first.chatCalls.length !== 1) throw new Error(`Expected one AI request, got ${first.chatCalls.length}.`);
            if (first.chatCalls[0]?.options?.model !== 'qwen/qwen3.6-27b') {
              throw new Error(`Wrong AI model: ${first.chatCalls[0]?.options?.model}`);
            }
            if (!/online/i.test(first.status)) throw new Error(`AI did not reach online state: ${first.status}`);
            if (first.error) throw new Error(`Unexpected visible AI error: ${first.error}`);

            await page.fill('#chatInput', 'Second message.');
            await page.click('#sendBtn');
            await page.waitForFunction(() => window.__chatCalls.length === 2, null, { timeout: 10000 });
            const second = await page.evaluate(() => ({
              signInCalls: window.__signInCalls,
              chatCalls: window.__chatCalls.length
            }));
            if (second.signInCalls !== 1) throw new Error('AI re-authenticated unnecessarily on the second message.');
            if (second.chatCalls !== 2) throw new Error('Second AI message did not reach the provider path.');

            await browser.close();
            console.log('Interpreter AI browser integration passed: no background popup, auth under Send gesture, Qwen3.6 27B request, visible response, reusable session.');
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

          cd /tmp/interpreter-ai-test
          node test.cjs
